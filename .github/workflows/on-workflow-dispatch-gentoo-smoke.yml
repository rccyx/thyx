name: gentoo-smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gentoo:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: build gentoo test root
        run: |
          set -euo pipefail

          cat >Dockerfile.gentoo-smoke <<'EOF'
          FROM gentoo/portage:latest AS portage
          FROM gentoo/stage3:latest

          COPY --from=portage /var/db/repos/gentoo /var/db/repos/gentoo
          EOF

          docker build -f Dockerfile.gentoo-smoke -t thyx-gentoo-smoke .

      - name: smoke
        run: |
          set -euo pipefail

          docker run --rm \
            -v "${PWD}:/work" \
            -w /work \
            thyx-gentoo-smoke \
            bash -lc '
              set -euo pipefail

              bash ./scripts/install --yes

              test -f /etc/portage/package.use/thyx
              grep -qE "^x11-misc/sddm[[:space:]].*X" /etc/portage/package.use/thyx
              grep -qE "^x11-misc/sddm[[:space:]].*elogind" /etc/portage/package.use/thyx
              grep -qE "^x11-libs/libxkbcommon[[:space:]].*X" /etc/portage/package.use/thyx
              grep -qE "^media-libs/libglvnd[[:space:]].*X" /etc/portage/package.use/thyx
              grep -qE "^sys-auth/pambase[[:space:]].*elogind" /etc/portage/package.use/thyx
              grep -qE "^dev-qt/qtmultimedia[[:space:]].*qml" /etc/portage/package.use/thyx
              grep -qE "^dev-qt/qt5compat[[:space:]].*qml" /etc/portage/package.use/thyx

              test -d /usr/share/sddm/themes/thyx
              test -f /usr/share/sddm/themes/thyx/metadata.desktop
              test -f /usr/share/sddm/themes/thyx/theme.conf
              test -f /usr/share/sddm/themes/thyx/src/Main.qml
              test -f /etc/sddm.conf

              grep -qE "^[[:space:]]*Current[[:space:]]*=[[:space:]]*thyx[[:space:]]*$" /etc/sddm.conf

              bash ./scripts/uninstall --yes

              test ! -d /usr/share/sddm/themes/thyx
              test ! -d /usr/local/share/fonts/thyx
              test ! -e /etc/sddm.conf.thyx-back

              if [ -f /etc/sddm.conf ]; then
                if grep -qE "^[[:space:]]*Current[[:space:]]*=[[:space:]]*thyx[[:space:]]*$" /etc/sddm.conf; then
                  echo "still selects thyx: /etc/sddm.conf" >&2
                  exit 1
                fi
              fi
            '
