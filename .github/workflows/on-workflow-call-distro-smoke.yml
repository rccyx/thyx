name: install-uninstall

on:
  workflow_call:

permissions:
  contents: read

jobs:
  install-uninstall:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - id: debian-bookworm
            image: debian:bookworm

          - id: debian-trixie
            image: debian:trixie
            greeter: true

          - id: debian-testing
            image: debian:testing

          - id: debian-sid
            image: debian:sid

          - id: ubuntu-22.04
            image: ubuntu:22.04

          - id: ubuntu-26.04
            image: ubuntu:26.04

          - id: popos-22.04
            image: nycticoracs/pop_os:22.04
            expect_id: pop

          - id: fedora-44
            image: fedora:44

          - id: arch/feb-08-2026
            image: archlinux:base-20260208.0.488728@sha256:901ce548a325fe7cec8895e5837343af9c8ec89edb420d3a96b2cc6f5e86c771
            greeter: true

          - id: opensuse-tumbleweed
            image: opensuse/tumbleweed:latest

          - id: alpine-edge
            image: alpine:edge

    name: install uninstall (${{ matrix.id }})

    container:
      image: ${{ matrix.image }}

    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      DEBIAN_FRONTEND: noninteractive
      DEBIAN_PRIORITY: critical
      APT_LISTCHANGES_FRONTEND: none
      GIT_TERMINAL_PROMPT: "0"
      EXPECT_ID: ${{ matrix.expect_id || '' }}
      LOAD_GREETER: ${{ matrix.greeter == true && 'true' || 'false' }}

    steps:
      - name: checkout
        uses: actions/checkout@v4

      - name: show distro identity
        shell: sh
        run: |
          set -eu

          cat /etc/os-release

          if [ -n "${EXPECT_ID}" ]; then
            grep -q "^ID=${EXPECT_ID}$" /etc/os-release
          fi

      - name: install base dependencies
        shell: sh
        run: |
          set -eu

          pkgs="sudo ca-certificates bash git"
          missing=false

          for tool in sudo bash git; do
            if ! command -v "${tool}" >/dev/null 2>&1; then
              missing=true
            fi
          done

          if [ "${missing}" = false ]; then
            exit 0
          fi

          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends ${pkgs}
          elif command -v dnf >/dev/null 2>&1; then
            dnf -y install ${pkgs}
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Syu --noconfirm --needed ${pkgs}
          elif command -v zypper >/dev/null 2>&1; then
            zypper --non-interactive refresh
            zypper --non-interactive install --no-recommends ${pkgs}
          elif command -v apk >/dev/null 2>&1; then
            apk update
            apk add --no-cache ${pkgs}
          else
            echo "no supported package manager found" >&2
            exit 1
          fi

      - name: prepare apt container
        shell: bash
        run: |
          set -Eeuo pipefail

          command -v apt-get >/dev/null 2>&1 || exit 0
          [ "$(cat /proc/1/comm 2>/dev/null || true)" = "systemd" ] && exit 0

          mkdir -p /usr/sbin

          printf '%s\n' '#!/bin/sh' 'exit 101' >/usr/sbin/policy-rc.d
          chmod 0755 /usr/sbin/policy-rc.d

          if [ -e /usr/sbin/invoke-rc.d ]; then
            mv /usr/sbin/invoke-rc.d /usr/sbin/invoke-rc.d.real 2>/dev/null || true
            printf '%s\n' '#!/bin/sh' 'exit 0' >/usr/sbin/invoke-rc.d
            chmod 0755 /usr/sbin/invoke-rc.d
          fi

          if [ -e /usr/sbin/service ]; then
            mv /usr/sbin/service /usr/sbin/service.real 2>/dev/null || true
            printf '%s\n' '#!/bin/sh' 'exit 0' >/usr/sbin/service
            chmod 0755 /usr/sbin/service
          fi

          for path in /usr/bin/systemctl /bin/systemctl; do
            if [ -e "${path}" ]; then
              mv "${path}" "${path}.real" 2>/dev/null || true
              printf '%s\n' '#!/bin/sh' 'exit 0' >"${path}"
              chmod 0755 "${path}"
            fi
          done

      - name: install theme
        shell: bash
        run: |
          set -euo pipefail

          bash ./scripts/install --yes

      - name: verify installed theme artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -d /usr/share/sddm/themes/thyx
          test -f /usr/share/sddm/themes/thyx/metadata.desktop
          test -f /usr/share/sddm/themes/thyx/theme.conf
          test -f /usr/share/sddm/themes/thyx/src/Main.qml
          test -f /etc/sddm.conf

          grep -qE '^[[:space:]]*Current[[:space:]]*=[[:space:]]*thyx[[:space:]]*$' /etc/sddm.conf

      - name: load greeter
        shell: bash
        run: |
          set -euo pipefail

          if [ "${LOAD_GREETER}" != "true" ]; then
            echo "greeter load disabled for this target"
            exit 0
          fi

          if command -v apt-get >/dev/null 2>&1; then
            apt-get update
            apt-get install -y --no-install-recommends xvfb dbus dbus-x11
          elif command -v pacman >/dev/null 2>&1; then
            pacman -Syu --noconfirm --needed xorg-server-xvfb dbus
          else
            echo "greeter load enabled on unsupported package manager" >&2
            exit 1
          fi

          greeter="$(
            command -v sddm-greeter-qt6 ||
            command -v sddm-greeter ||
            find /usr -type f \( -name sddm-greeter-qt6 -o -name sddm-greeter \) -print -quit
          )"

          if [ -z "${greeter}" ]; then
            echo "sddm greeter not found" >&2
            exit 1
          fi

          export DISPLAY=:99

          Xvfb :99 -screen 0 1280x720x24 >/tmp/xvfb.log 2>&1 &
          xvfb_pid="$!"

          trap 'kill "${xvfb_pid}" >/dev/null 2>&1 || true' EXIT
          sleep 1

          if command -v dbus-run-session >/dev/null 2>&1; then
            runner="dbus-run-session --"
          else
            runner=""
          fi

          set +e
          ${runner} timeout 8s env QT_QPA_PLATFORM=xcb "${greeter}" --test-mode --theme /usr/share/sddm/themes/thyx
          code="$?"
          set -e

          [ "${code}" -eq 0 ] || [ "${code}" -eq 124 ]

      - name: uninstall theme
        shell: bash
        run: |
          set -euo pipefail

          bash ./scripts/uninstall --yes

      - name: verify uninstalled theme artifacts
        shell: bash
        run: |
          set -euo pipefail

          test ! -d /usr/share/sddm/themes/thyx
          test ! -d /usr/local/share/fonts/thyx
          test ! -e /etc/sddm.conf.thyx-back

          if [ -f /etc/sddm.conf ]; then
            if grep -qE '^[[:space:]]*Current[[:space:]]*=[[:space:]]*thyx[[:space:]]*$' /etc/sddm.conf; then
              echo "still selects thyx: /etc/sddm.conf" >&2
              exit 1
            fi
          fi

      - name: prepare backup restore state
        shell: bash
        run: |
          set -euo pipefail

          rm -rf /usr/share/sddm/themes/thyx
          rm -rf /usr/local/share/fonts/thyx
          rm -f /etc/sddm.conf /etc/sddm.conf.thyx-back

          printf '[Theme]\nCurrent=breeze\n' >/etc/sddm.conf

      - name: install over existing theme selection
        shell: bash
        run: |
          set -euo pipefail

          bash ./scripts/install --yes

      - name: verify backup restore install
        shell: bash
        run: |
          set -euo pipefail

          test -d /usr/share/sddm/themes/thyx
          test -f /usr/share/sddm/themes/thyx/metadata.desktop
          test -f /usr/share/sddm/themes/thyx/theme.conf
          test -f /usr/share/sddm/themes/thyx/src/Main.qml
          test -f /etc/sddm.conf
          test -f /etc/sddm.conf.thyx-back

          grep -qE '^[[:space:]]*Current[[:space:]]*=[[:space:]]*thyx[[:space:]]*$' /etc/sddm.conf
          grep -qE '^[[:space:]]*Current[[:space:]]*=[[:space:]]*breeze[[:space:]]*$' /etc/sddm.conf.thyx-back

      - name: uninstall from backup restore state
        shell: bash
        run: |
          set -euo pipefail

          bash ./scripts/uninstall --yes

      - name: verify backup restore uninstall
        shell: bash
        run: |
          set -euo pipefail

          test ! -d /usr/share/sddm/themes/thyx
          test ! -d /usr/local/share/fonts/thyx
          test ! -e /etc/sddm.conf.thyx-back

          grep -qE '^[[:space:]]*Current[[:space:]]*=[[:space:]]*breeze[[:space:]]*$' /etc/sddm.conf
